{% extends "news/base.html" %}

{% block content %}

<div class="container mt-4">

    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Newsletter
        </button>

        <a href="{% url 'journalist_dashboard' %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
