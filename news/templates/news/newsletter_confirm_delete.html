{% extends "news/base.html" %}

{% block title %}
    Delete Newsletter - NewsHub
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h1 class="h5 mb-0">
                Delete Newsletter
            </h1>
        </div>

        <div class="card-body">

            <p>
                Are you sure you want to delete
                <strong>{{ newsletter.title }}</strong>?
            </p>

            <p class="text-muted">
                This action cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'journalist_dashboard' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
