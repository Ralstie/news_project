{% extends "news/base.html" %}

{% block title %}{{ page_title }} - NewsHub{% endblock %}

{% block content %}
<h1>{{ page_title }}</h1>

<form method="post" class="mt-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-secondary" href="{% url 'publisher_dashboard' %}">
        Cancel
    </a>
</form>
{% endblock %}
