{% extends "news/base.html" %}

{% block title %}Delete Publisher - NewsHub{% endblock %}

{% block content %}
<h1>Delete Publisher</h1>
<p>Are you sure you want to delete "{{ publisher.name }}"?</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'publisher_dashboard' %}">
        Cancel
    </a>
</form>
{% endblock %}
