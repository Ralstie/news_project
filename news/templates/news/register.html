{% extends "news/base.html" %}

{% block title %}Register - NewsHub{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Create an Account
                </h2>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Register
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
